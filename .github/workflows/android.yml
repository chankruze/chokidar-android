name: Android CI

on:
  push:
    tags:
      - "v*.*.*" # for versioned releases (v1.2.3)
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git tags + changelog

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # ----------------------------
      # Auto-versioning using Git tag
      # ----------------------------
      - name: Extract version name & code
        id: version
        run: |
          # Git tag expected format: v1.2.3
          TAG=${GITHUB_REF#refs/tags/}
          VERSION_NAME=${TAG#v}
          
          # Version code = timestamp as integer
          VERSION_CODE=$(date +%s)

          echo "versionName=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT

      # Write keystore inside /app directory
      - name: Decode Keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/my-release-key.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ----------------------------
      # Inject versionName + versionCode to Gradle
      # ----------------------------
      - name: Write version properties
        run: |
          echo "VERSION_NAME=${{ steps.version.outputs.versionName }}" > version.properties
          echo "VERSION_CODE=${{ steps.version.outputs.versionCode }}" >> version.properties
      # Now Gradle can read versionName/versionCode from version.properties

      # ----------------------------
      # Build Debug APK
      # ----------------------------
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # ----------------------------
      # Build Signed Release APK + AAB
      # ----------------------------
      - name: Build Release APK & AAB
        run: ./gradlew assembleRelease bundleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab

      # ----------------------------
      # Release Notes Generation
      # ----------------------------
      - name: Generate Release Notes (Commit Log)
        id: notes
        run: |
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          git log -10 --pretty=format:"- %s" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ----------------------------
      # Create GitHub Release (Only when pushing a version tag)
      # ----------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ steps.version.outputs.versionName }}"
          body: ${{ steps.notes.outputs.release_notes }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
